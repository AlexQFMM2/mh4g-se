name: Windows Portable Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 5, OpenSSL and MinGW
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-angleproject
            mingw-w64-x86_64-qt5

      - name: Validate generated data
        shell: pwsh
        run: python .\tools\validate_data.py .\data --no-samples

      - name: Build portable package
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: .\build-windows.ps1 -QtBin "$env:MSYS2_LOCATION\mingw64\bin"

      - name: Verify portable runtime
        shell: pwsh
        run: |
          Push-Location .\release\windows
          if (-not (Test-Path .\sqldrivers\qsqlite.dll)) { throw "QSQLITE plugin is missing" }
          if (-not (Test-Path .\data\mh4g.sqlite)) { throw "MH4G SQLite is missing" }
          .\MH4GSaveEditor.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Management-window smoke test failed: $LASTEXITCODE" }
          .\MH4GSaveEditor.exe --smoke-test-loadout
          if ($LASTEXITCODE -ne 0) { throw "Loadout smoke test failed: $LASTEXITCODE" }
          .\MH4GSaveEditor.exe --smoke-test-account
          if ($LASTEXITCODE -ne 0) { throw "Account/HTTPS smoke test failed: $LASTEXITCODE" }
          .\MH4GSaveEditor.exe --smoke-test-ssl
          if ($LASTEXITCODE -ne 0) { throw "Qt SSL smoke test failed: $LASTEXITCODE" }
          Pop-Location

      - name: Test loadout and searchable combo interaction
        shell: msys2 {0}
        run: |
          ./tests/run-loadout-core-tests.sh
          ./tests/run-searchable-combo-tests.sh

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path .\release\windows\* -DestinationPath .\MH4GSaveEditor-windows-portable.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MH4GSaveEditor-windows-portable
          path: MH4GSaveEditor-windows-portable.zip

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MH4GSaveEditor-windows-portable.zip
